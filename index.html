<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КОТЯМЬБУСЬ! v2.9.5 Stable</title>
    <link rel="stylesheet" href="style.css?v=final">
</head>
<body>
    <div id="game-container">
        <header>
            <h1 id="cat-name">БАСЯ</h1>
            <div class="stat-box">Котокойны: <span id="coins">0</span> 🐾</div>


        </header>

        <div id="cat-area">
            <img src="images/cats/basya/b01.jpg" id="cat-photo" alt="Котямбусь">
        </div>

        <nav class="controls">
            <button onclick="switchCat('basya')">БАСЯ</button>
            <button onclick="switchCat('saveliy')">САВЕЛИЙ</button>
            <button onclick="nextPhoto()">🖼️ ФОТО</button>
            <label class="custom-btn">
                📸 СВОЙ
                <input type="file" accept="image/*" onchange="uploadOwnCat(event)" style="display:none">
            </label>
        </nav>

        <footer>
            <button onclick="resetGame()" class="reset-btn">СБРОСИТЬ ВСЁ</button>
            <div class="version">v2.9.5 Mobile LTS 🐾</div>
        </footer>
    </div>
    <script src="script.js?v=final"></script>
</body>
</html>
