<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>КОТЯМЬБУСЬ! v3.0 Live</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1 id="cat-name">БАСЯ</h1>
            <p id="cat-status">🏆 Статус: Новичок 🐾</p>
        </header>

        <div id="main-ui">
            <div class="stat-box">Монеты: <span id="coins">0</span> 💰</div>
            <div class="stat-box">Совесть: <div id="patience-bar"><div id="patience-fill"></div></div></div>
        </div>

        <div id="cat-area">
            <!-- Путь исправлен на твой b01.jpg -->
            <img src="images/b01.jpg" id="cat-photo" alt="Котик">
            <div id="bite-overlay">🩹 КУСЬ!</div>
        </div>

        <nav class="controls">
            <button onclick="switchCat('basya')">БАСЯ (Hard)</button>
            <button onclick="switchCat('saveliy')">САВЕЛИЙ (Easy)</button>
        </nav>

        <footer>
            <button onclick="resetGame()">СБРОСИТЬ ВСЁ</button>
            <div class="version">v3.0.0 Stable Build 🐾</div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
