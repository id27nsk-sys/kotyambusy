<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾КОТЯМБУСЫ🐾</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <h1 id="main-title">🐾КОТЯМБУСЫ🐾</h1>
        
        <!-- ZEN_DASHBOARD_STRICT: Тонкая полоса прогресса -->
        <div class="zen-stats">
            <span id="stat-line">🐾 0 | Фото: 1/1</span>
        </div>

        <div class="hero-display" onclick="handleAction(event)">
            <img src="images/cats/basya/b01.webp" id="target-cat" alt="🐾">
        </div>

        <nav class="hero-selector">
            <button class="selector-btn" onclick="selectHero('b')">🐾 БАСЯ</button>
            <button class="selector-btn" onclick="selectHero('s')">🐾 САВЕЛИЙ</button>
        </nav>
        
        <div class="control-grid">
            <button class="glass-btn small" onclick="showPhotos()">🐾 ФОТО</button>
            <button class="glass-btn reset" onclick="resetAll()">СБРОС 🐾</button>
        </div>
    </div>

    <footer class="admin-footer">
        <div class="admin-trigger" onclick="openAuth()">🧶</div>
    </footer>

    <div id="auth-modal" class="modal-overlay" onclick="closeModals(event)">
        <div class="glass-container auth-box">
            <input type="password" id="admin-pass" oninput="checkPass(this.value)">
        </div>
    </div>

    <div id="workshop-modal" class="modal-overlay" onclick="closeModals(event)">
        <div class="glass-container workshop-box">
            <h2 style="font-size: 1.1rem;">🐾 МАСТЕРСКАЯ</h2>
            <input type="file" id="file-input" accept="image/*" onchange="handleFile(event)" class="glass-btn" style="width:100%;">
            <div id="crop-area">
                <canvas id="crop-canvas"></canvas>
                <div class="circle-mask"></div>
            </div>
            <div class="zoom-control">
                <span>➖</span>
                <input type="range" id="zoom-slider" min="0.1" max="3" step="0.01" value="1" oninput="handleZoom(this.value)">
                <span>➕</span>
            </div>
            <p id="filename-preview" style="font-size: 0.7rem; color: rgba(255,152,0,0.8);">Загрузите фото</p>
            <div class="workshop-controls">
                <button class="glass-btn" id="btn-b" onclick="exportPhoto('b')">БАСЯ</button>
                <button class="glass-btn" id="btn-s" onclick="exportPhoto('s')">САВЕЛИЙ</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
