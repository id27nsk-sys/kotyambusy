<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐾КОТЯМБУСЫ🐾</title>
    <link rel="icon" href="images/favicon.png" type="image/png">
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="glass-container">
        <h1 id="main-title">🐾КОТЯМБУСЫ🐾</h1>
        
        <div class="stats-panel">
            <p>Кото-койны: <span id="coin-count">0</span> 🐾</p>
            <p>Открыто фото: <span id="photo-stat">1/5</span> 🐾</p>
        </div>

        <!-- SHAPE_STRICT: Круглое окно героя -->
        <div class="hero-display">
            <img src="images/cats/basya/b01.jpg" id="target-cat" alt="🐾">
        </div>

        <button class="glass-btn pulse" onclick="handleAction()">🐾 КУСЬ! 🐾</button>

        <nav class="hero-selector">
            <button class="selector-btn" onclick="selectHero('b')">🐾 БАСЯ</button>
            <button class="selector-btn" onclick="selectHero('s')">🐾 САВЕЛИЙ</button>
        </nav>
        
        <div class="control-grid">
            <button class="glass-btn small" onclick="showPhotos()">🐾 ФОТО</button>
            <button class="glass-btn reset" onclick="resetAll()">СБРОС 🐾</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
